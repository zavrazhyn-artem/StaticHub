; =============================================================================
; Supervisord config for the worker-default pod (k8s pool=core).
;
; Latency-sensitive light queues that stay hot 24/7:
;   default  — orchestrator job + misc fallback (1 process)
;   compile  — CPU-bound JSON/DTO building (1 process)
;   discord  — RSVP interactions, short timeout (1 process)
;
; bnet/rio/wcl live in supervisord-sync.conf; ai lives in supervisord-ai.conf.
; =============================================================================

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; -----------------------------------------------------------------------
; default — orchestrator + misc fallback
; -----------------------------------------------------------------------
[program:queue-default]
command=php -d memory_limit=256M artisan queue:work redis
    --queue=default
    --sleep=3
    --tries=3
    --backoff=30
    --timeout=120
    --memory=256
    --max-jobs=500
    --max-time=3600
directory=/var/www/html
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------
; compile — CPU-bound JSON/DTO building. Single worker keeps CPU
; predictable; ShouldBeUnique guarantees one compile per character at a time.
; -----------------------------------------------------------------------
[program:queue-compile]
command=php -d memory_limit=512M artisan queue:work redis
    --queue=compile
    --sleep=3
    --tries=3
    --backoff=30
    --timeout=60
    --memory=512
    --max-jobs=500
    --max-time=3600
directory=/var/www/html
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------
; discord — low-latency RSVP interactions; shorter timeout, faster sleep.
; -----------------------------------------------------------------------
[program:queue-discord]
command=php -d memory_limit=256M artisan queue:work redis
    --queue=discord
    --sleep=1
    --tries=3
    --backoff=5
    --timeout=60
    --memory=256
    --max-jobs=500
    --max-time=3600
directory=/var/www/html
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
