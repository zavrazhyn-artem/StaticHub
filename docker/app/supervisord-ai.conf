; =============================================================================
; Supervisord config for the worker-ai pod (k8s pool=ai).
;
; AI analysis pod — pod can wait for Gemini up to 20 minutes per job.
; KEDA scales replicas 0-2 based on queue depth; node pool autoscales
; 0-2 to match. The pod has terminationGracePeriodSeconds=3600 and a
; PDB with maxUnavailable=0, so k8s never kills a job mid-Gemini call.
;
; ProcessRaidAnalysisJob is ShouldBeUnique per report — duplicate
; dispatch from chat activation collapses into a single in-flight job.
; =============================================================================

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; -----------------------------------------------------------------------
; ai — Gemini analysis queue
; -----------------------------------------------------------------------
[program:queue-ai]
command=php -d memory_limit=1024M artisan queue:work redis
    --queue=ai
    --sleep=3
    --tries=2
    --backoff=60
    --timeout=1200
    --memory=1024
    --max-jobs=50
    --max-time=7200
directory=/var/www/html
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
