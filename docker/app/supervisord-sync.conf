; =============================================================================
; Supervisord config for the worker-sync pod (k8s pool=sync).
;
; Hot pool that hammers external APIs. ShouldBeUnique + RateLimited per
; api-bucket caps per-API throughput regardless of pod count.
;   bnet — Battle.net character/guild fetch (2 processes)
;   rio  — Raider.io scores fetch (1 process)
;   wcl  — Warcraft Logs metadata fetch (1 process)
;
; 2+1+1 = 4 concurrent queue workers per pod ≈ 480MB peak, fits a 2GB
; sync node with headroom. HPA scaling 1→2 pods → up to 8 concurrent
; fetchers. Bump numprocs (and node size) when beta load grows.
; =============================================================================

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; -----------------------------------------------------------------------
; bnet — Battle.net API queue
; -----------------------------------------------------------------------
[program:queue-bnet]
command=php -d memory_limit=256M artisan queue:work redis
    --queue=bnet
    --sleep=3
    --tries=3
    --backoff=60
    --timeout=120
    --memory=256
    --max-jobs=500
    --max-time=3600
directory=/var/www/html
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------
; rio — Raider.io API queue
; -----------------------------------------------------------------------
[program:queue-rio]
command=php -d memory_limit=256M artisan queue:work redis
