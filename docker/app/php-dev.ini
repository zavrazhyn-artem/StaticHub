; =============================================================================
; Local dev overrides on top of php.ini.
; Drops in via volume mount in docker-compose.yml so production image stays
; clean. Enables timestamp validation so Octane :reload picks up source edits.
; =============================================================================

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Opcache: revalidate every request so file edits land without manual reload.
; Cost is small in dev (single request stream) and saves a `octane:reload`
; round-trip on every source change.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit_buffer_size = 0
opcache.jit = off

; Larger memory limits for tinker / artisan jobs in dev shells.
memory_limit = 512M
