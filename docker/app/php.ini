; =============================================================================
; PHP runtime config for the FrankenPHP app image.
;
; Tuned for Octane worker mode: opcache aggressive, no timestamp revalidation
; in production. Local dev overrides this with docker/app/php-dev.ini that
; flips opcache.validate_timestamps back on so file changes are picked up.
; =============================================================================

memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 60
max_input_vars = 5000
date.timezone = UTC

; --- OPcache ---------------------------------------------------------------
; Aggressive cache for Octane: code never changes between requests since the
; worker stays alive. Bump revalidate_freq to 0 in prod to skip timestamp checks
; entirely (we restart workers on deploy via SIGTERM → rolling pod replacement).
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit_buffer_size = 128M
opcache.jit = tracing

; OpCache preload — compiles hot files into shared memory at PHP startup so
; the first request to a fresh Octane worker doesn't pay the parse cost.
; preload_user must match the user PHP runs as (www-data per Dockerfile).
opcache.preload = /var/www/html/bootstrap/opcache.php
opcache.preload_user = www-data

; --- Error handling --------------------------------------------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Session ---------------------------------------------------------------
session.gc_maxlifetime = 86400
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; --- Misc ------------------------------------------------------------------
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
