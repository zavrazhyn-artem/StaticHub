server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()" always;

    # CSP — Report-Only first so violations log to DevTools but nothing blocks.
    # Promote to "Content-Security-Policy" once no violations seen for a few days.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.blastr.pro https://wow.zamimg.com http://local.blastr.pro:5173 ws://local.blastr.pro:5173; style-src 'self' 'unsafe-inline' https://cdn.blastr.pro https://fonts.googleapis.com; font-src 'self' data: https://cdn.blastr.pro https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cdn.blastr.pro https://*.ingest.de.sentry.io https://*.ingest.us.sentry.io https://nether.wowhead.com ws://local.blastr.pro:5173 wss://local.blastr.pro:5173; worker-src 'self' blob:; frame-src 'self' https://discord.com; object-src 'none'; base-uri 'self'; form-action 'self' https://discord.com https://eu.battle.net https://us.battle.net; frame-ancestors 'self'" always;

    # Hide server version
    server_tokens off;

    # Vite-built assets – immutable, 1-year cache
    location ~* /build/.+\.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Generic static files
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Main Laravel entry point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM proxy
    location ~ \.php$ {
        fastcgi_pass            app:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include                 fastcgi_params;
        fastcgi_read_timeout    120s;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Laravel health check (no PHP overhead)
    location = /up {
        fastcgi_pass  app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include       fastcgi_params;
    }

    error_page 404 /index.php;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
