apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: blastr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      nodeSelector:
        pool: core
      containers:
        - name: redisinsight
          image: redis/redisinsight:latest
          ports:
            - containerPort: 5540
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: blastr
spec:
  selector:
    app: redisinsight
  ports:
    - port: 80
      targetPort: 5540
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redisinsight
  namespace: blastr
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - redis.blastr.pro
      secretName: blastr-tls
  rules:
    - host: redis.blastr.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redisinsight
                port:
                  number: 80
