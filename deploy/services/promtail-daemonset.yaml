# =============================================================================
# Promtail DaemonSet — one pod per k8s node, tails container logs from
# /var/log/pods and ships to Loki on the service droplet over VPC.
#
# Apply AFTER the service droplet is up and Loki listening on
# <VPC_INTERFACE_IP>:3100.
#
# kubectl apply -f deploy/services/promtail-daemonset.yaml
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: observability
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      # Route via Caddy HTTPS — direct VPC routing not available between
      # this k8s cluster and the service droplet (different VPC).
      - url: https://obs.blastr.pro/loki/api/v1/push

    scrape_configs:
      # Use static file glob instead of kubernetes_sd_configs.
      # kubernetes_sd in Promtail 3.2 fails to discover targets on DOKS despite
      # correct RBAC (confirmed: API returns 42+ pods but SD shows 0/0).
      # File glob is simpler and reliable: directly tail CRI log files by namespace.
      - job_name: blastr-pods
        static_configs:
          - targets: [localhost]
            labels:
              namespace: blastr
              __path__: /var/log/pods/blastr_*/*/*.log
        pipeline_stages:
          - cri: {}
        relabel_configs:
          # Extract pod name and component from the file path.
          # Path format: /var/log/pods/<ns>_<pod-name>_<uid>/<container>/<n>.log
          - source_labels: [__path__]
            regex: '/var/log/pods/[^_]+_([^_]+)_[^/]+/([^/]+)/.*'
            replacement: '$1'
            target_label: pod
          - source_labels: [__path__]
            regex: '/var/log/pods/[^_]+_[^_]+_[^/]+/([^/]+)/.*'
            replacement: '$1'
            target_label: component
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: observability
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
        # Run on every node including future taints.
        - operator: Exists
      containers:
        - name: promtail
          image: grafana/promtail:3.2.1
          args:
            - -config.file=/etc/promtail/promtail.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: run
          hostPath:
            path: /run/promtail
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
