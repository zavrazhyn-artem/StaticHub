# =============================================================================
# Service droplet stack — runs on a separate $24 droplet alongside the main
# k8s cluster. Persists data on two DO Block Storage volumes (Postgres,
# Loki) so the droplet can be rebooted/rebuilt without losing observability.
#
# Hosts at obs.blastr.pro (Cloudflare proxied) → caddy → glitchtip + grafana.
# k8s pods ship errors via SENTRY_LARAVEL_DSN (GlitchTip wire-compatible)
# and logs via promtail DaemonSet → Loki.
#
# First-time setup: see deploy/PHASE_6_SERVICES.md
# =============================================================================

name: blastr-services

# Cap container stdout/stderr on the droplet's root disk. Without this,
# json-file (Docker default) writes unbounded to /var/lib/docker/containers/
# and a chatty container can fill the 25GB root SSD in days. Postgres and
# Loki data already live on separate Block Storage volumes; this protects
# the OS disk from being killed by app logs.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------------------
  # Caddy — TLS termination + reverse proxy. Uses CF Origin wildcard cert
  # mounted from /etc/ssl/cloudflare/ on the host.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: blastr_obs_caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - glitchtip-web
      - grafana
    networks:
      - obs_network

  # ---------------------------------------------------------------------------
  # GlitchTip — self-hosted Sentry-compatible error tracker.
  # https://glitchtip.com
  # ---------------------------------------------------------------------------
  glitchtip-postgres:
    image: postgres:16-alpine
    container_name: blastr_obs_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # DO Block Storage volume mounted at /mnt/glitchtip_pg on host.
      # Note: DO auto-mounts with underscores (not hyphens).
      - /mnt/glitchtip_pg:/var/lib/postgresql/data
    networks:
      - obs_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5

  glitchtip-redis:
    image: redis:7-alpine
    container_name: blastr_obs_redis
    restart: unless-stopped
    logging: *default-logging
    networks:
      - obs_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  glitchtip-web:
    image: glitchtip/glitchtip:v4.2
    container_name: blastr_obs_glitchtip_web
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://glitchtip:${POSTGRES_PASSWORD}@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: "8000"
      GLITCHTIP_DOMAIN: https://obs.blastr.pro
      DEFAULT_FROM_EMAIL: "noreply@blastr.pro"
      EMAIL_URL: "${GLITCHTIP_EMAIL_URL}"
      # Limit growth — older errors auto-prune.
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "14"
      ENABLE_OPEN_USER_REGISTRATION: "false"
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
    networks:
      - obs_network

  glitchtip-worker:
    image: glitchtip/glitchtip:v4.2
    container_name: blastr_obs_glitchtip_worker
    restart: unless-stopped
    logging: *default-logging
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgres://glitchtip:${POSTGRES_PASSWORD}@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: https://obs.blastr.pro
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "14"
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
    networks:
      - obs_network

  # ---------------------------------------------------------------------------
  # Loki — log aggregator. Promtail DaemonSet in DOKS ships pod logs here
  # over the VPC private network. Storage on second Block Storage volume.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.2.1
    container_name: blastr_obs_loki
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Exposed on VPC interface only — Promtail in DOKS connects via private IP.
      - "${VPC_INTERFACE_IP}:3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - /mnt/loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - obs_network

  # ---------------------------------------------------------------------------
  # Grafana — UI for Loki logs + (optional) GlitchTip dashboards.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: blastr_obs_grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://obs.blastr.pro/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - loki
    networks:
      - obs_network

  # ---------------------------------------------------------------------------
  # Headlamp — Kubernetes web UI. Connects to DOKS via kubeconfig.
  # Accessible at k8s.blastr.pro (CF Access protected).
  # ---------------------------------------------------------------------------
  headlamp:
    image: ghcr.io/headlamp-k8s/headlamp:latest
    container_name: blastr_obs_headlamp
    restart: unless-stopped
    logging: *default-logging
    command: ["-plugins-dir=/headlamp/plugins", "-kubeconfig=/tmp/kubeconfig"]
    volumes:
      - ./kubeconfig:/tmp/kubeconfig:ro
    networks:
      - obs_network

  # ---------------------------------------------------------------------------
  # Adminer — lightweight web UI for DO Managed MySQL.
  # Accessible at db.blastr.pro (CF Access protected).
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: blastr_obs_adminer
    restart: unless-stopped
    logging: *default-logging
    networks:
      - obs_network

  # ---------------------------------------------------------------------------
  # RedisInsight — web UI for DO Managed Valkey.
  # Accessible at redis.blastr.pro (CF Access protected).
  # ---------------------------------------------------------------------------
  redisinsight:
    image: redis/redisinsight:latest
    container_name: blastr_obs_redisinsight
    restart: unless-stopped
    logging: *default-logging
    networks:
      - obs_network

networks:
  obs_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  grafana_data:
