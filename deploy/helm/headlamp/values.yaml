ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  hosts:
    - host: k8s.blastr.pro
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: blastr-tls
      hosts:
        - k8s.blastr.pro

clusterAdminRole: true

nodeSelector:
  pool: core

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
