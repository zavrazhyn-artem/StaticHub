apiVersion: batch/v1
kind: Job
metadata:
  # Unique name per revision so successive upgrades don't collide.
  name: {{ include "blastr.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "blastr.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run BEFORE the upgrade rolls out new pods. If migrate fails, Helm
    # aborts the upgrade — old pods stay live, no half-broken deploy.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "blastr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- include "blastr.imagePullSecrets" . | nindent 6 }}
      # NO nodeSelector — migrate is short-lived, just needs DB access (any
      # node in the cluster reaches Managed MySQL via VPC). Pinning to core
      # makes the hook fight scheduler + worker-default for memory.
      containers:
        - name: migrate
          image: {{ include "blastr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          # Migrate runs as a pre-install/pre-upgrade Helm hook, BEFORE regular
          # resources (ConfigMap) get applied. We can't envFrom: configMapRef
          # here — pod would loop in CreateContainerConfigError waiting for a
          # ConfigMap that doesn't exist yet. The Secret has everything migrate
          # actually needs (APP_KEY + DB_*); APP_ENV/APP_DEBUG fall back to
          # config/*.php defaults baked into the image.
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
