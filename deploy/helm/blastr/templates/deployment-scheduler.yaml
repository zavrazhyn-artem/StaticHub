apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blastr.fullname" . }}-scheduler
  labels:
    {{- include "blastr.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  # schedule:work is single-instance by design — overlap protected by
  # ->onOneServer() locks but k8s shouldn't run two pods either.
  replicas: {{ .Values.scheduler.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "blastr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "blastr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "blastr.imagePullSecrets" . | nindent 6 }}
      nodeSelector:
        pool: {{ .Values.nodePools.core }}
      containers:
        - name: scheduler
          image: {{ include "blastr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["scheduler"]
          {{- include "blastr.envFrom" . | nindent 10 }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      terminationGracePeriodSeconds: 60
