{{- /*
Plain Secret template — NOT committed populated.

In practice this template is rendered with values.secret.dummyValues=true
only for `helm template` validation. Real secrets ship as a SealedSecret
generated out-of-band via kubeseal, stored in
deploy/helm/blastr/sealed/blastr-env.sealed.yaml and applied to the cluster
ahead of any `helm install/upgrade`.

The sealed-secrets controller decrypts the SealedSecret in-cluster into a
regular Secret named `{{ .Values.secret.name }}` which the Deployments
reference via `envFrom: secretRef`.

Workflow:
  1. Maintain .env.production locally (NOT committed).
  2. kubectl create secret generic {{ .Values.secret.name }} \
       --from-env-file=.env.production --dry-run=client -o yaml \
       | kubeseal --format yaml > deploy/helm/blastr/sealed/blastr-env.sealed.yaml
  3. Commit the sealed YAML — it's encrypted with the cluster's public key.
  4. kubectl apply -f deploy/helm/blastr/sealed/blastr-env.sealed.yaml
  5. helm install/upgrade blastr ./deploy/helm/blastr

The block below is rendered only when helm is invoked with
`--set secret.renderPlaceholder=true` for local YAML linting purposes.
*/}}
{{- if .Values.secret.renderPlaceholder -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "blastr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.secret.keys }}
  {{ . }}: "placeholder-replaced-by-sealed-secret"
  {{- end }}
{{- end -}}
