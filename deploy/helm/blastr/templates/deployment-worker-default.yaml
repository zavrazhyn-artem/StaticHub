apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blastr.fullname" . }}-worker-default
  labels:
    {{- include "blastr.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-default
spec:
  replicas: {{ .Values.workerDefault.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "blastr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-default
  template:
    metadata:
      labels:
        {{- include "blastr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-default
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "blastr.imagePullSecrets" . | nindent 6 }}
      nodeSelector:
        pool: {{ .Values.nodePools.core }}
      containers:
        - name: worker
          image: {{ include "blastr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker-default"]
          {{- include "blastr.envFrom" . | nindent 10 }}
          resources:
            {{- toYaml .Values.workerDefault.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "supervisorctl -c /etc/supervisor/conf.d/default.conf status | grep -v STOPPED | grep -q RUNNING"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      # Allow queue:work --max-time chunks to drain on rolling deploy.
      terminationGracePeriodSeconds: 180
