apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blastr.fullname" . }}-web
  labels:
    {{- include "blastr.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "blastr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "blastr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        # Force pod restart on ConfigMap/Secret changes (rolling).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "blastr.imagePullSecrets" . | nindent 6 }}
      nodeSelector:
        pool: {{ .Values.nodePools.web }}
      containers:
        - name: web
          image: {{ include "blastr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["web"]
          ports:
            - name: http
              containerPort: 80
          {{- include "blastr.envFrom" . | nindent 10 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          # Liveness — Caddy static handler, always 200 if PHP is up.
          # Readiness — PHP route that pings DB + Redis; 503 pulls pod from
          # rotation when deps are unreachable.
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Allow Octane to drain in-flight requests on rolling deploys.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
      terminationGracePeriodSeconds: 30
