<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>BlastR · Vault Designs v1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0e10; font-family:'Inter', system-ui, sans-serif; color:#f9f5f8; }
  * { box-sizing: border-box; }
  .ms { font-family:'Material Symbols Rounded'; font-weight:500; line-height:1; vertical-align:middle; -webkit-font-feature-settings:'liga'; font-feature-settings:'liga'; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="dashboard/design-canvas.jsx"></script>
<script type="text/babel" src="dashboard/tokens.jsx"></script>
<script type="text/babel" src="roster/roster-shared.jsx"></script>
<script type="text/babel" src="roster/raids-shared.jsx"></script>
<script type="text/babel" src="roster/gear-shared.jsx"></script>
<script type="text/babel" src="roster/vault-shared.jsx"></script>
<script type="text/babel" src="roster/first-col.jsx"></script>
<script type="text/babel" src="roster/general-content.jsx"></script>
<script type="text/babel" src="roster/raids-content.jsx"></script>
<script type="text/babel" src="roster/gear-content.jsx"></script>
<script type="text/babel" src="roster/vault-content.jsx"></script>
<script type="text/babel" src="roster/shell.jsx"></script>
<script type="text/babel" data-presets="react">

function App() {
  const [tab1, setTab1] = React.useState('vault-v1');
  const [tab2, setTab2] = React.useState('vault-v2');
  const [tab3, setTab3] = React.useState('vault-v3');
  return (
    <DesignCanvas>
      <DCSection
        id="vault"
        title="Сейф · 3 варіанти"
        subtitle="Селектор тижня (фіолетовий, як у твоєму референсі) — справа над таблицею. Різниця — як рендериться 9 слотів і скільки інформації показуємо. Колір треку = рівень предмета (M помаранчевий, H фіолетовий, C синій, V зелений). «—» = слот ще не отримано.">

        <DCArtboard id="vault-v1" label="A · Numeric — близько до поточного, тільки числа кольорені по треку. Найщільніше." width={1280} height={900}>
          <RosterShell tab={tab1} onTabChange={setTab1}/>
        </DCArtboard>

        <DCArtboard id="vault-v2" label="B · Cards — кожен слот як міні-картка з ілвл + трек + рівень апгрейду (M 4/6 тощо). Більше інформації за один погляд." width={1280} height={900}>
          <RosterShell tab={tab2} onTabChange={setTab2}/>
        </DCArtboard>

        <DCArtboard id="vault-v3" label="C · Strip — 9 кольорових chip-ів в одному рядку, з мікро-трек-бейджем. Без вертикальних ліній груп — більше дихання." width={1280} height={900}>
          <RosterShell tab={tab3} onTabChange={setTab3}/>
        </DCArtboard>

      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
