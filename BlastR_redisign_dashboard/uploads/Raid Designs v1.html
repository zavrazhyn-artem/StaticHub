<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>BlastR · Raid Designs v1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0e10; font-family:'Inter', system-ui, sans-serif; color:#f9f5f8; }
  * { box-sizing: border-box; }
  .ms { font-family:'Material Symbols Rounded'; font-weight:500; line-height:1; vertical-align:middle; -webkit-font-feature-settings:'liga'; font-feature-settings:'liga'; }
  @keyframes pulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.4); opacity:0.55; } }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="dashboard/design-canvas.jsx"></script>
<script type="text/babel" src="dashboard/tokens.jsx"></script>
<script type="text/babel" src="roster/roster-shared.jsx"></script>
<script type="text/babel" src="roster/raids-shared.jsx"></script>
<script type="text/babel" src="roster/raids-v1.jsx"></script>
<script type="text/babel" src="roster/raids-v2.jsx"></script>
<script type="text/babel" src="roster/raids-v3.jsx"></script>
<script type="text/babel" data-presets="react">

function App() {
  return (
    <DesignCanvas>
      <DCSection id="raids-v1"
        title="Рейди · 3 варіанти"
        subtitle="Матриця гравці×боси, бінарне ✓/×, перемикач складностей M/H/N. 9 босів у 3 рейдах. Сортування по колонках. Альти розгортаються під мейном.">

        <DCArtboard id="r-v1" label="A · Compact Matrix — глифи ✓/×, sortable boss-колонки, mini-progress" width={1280} height={900}>
          <RaidsV1/>
        </DCArtboard>

        <DCArtboard id="r-v2" label="B · Heatmap-first — solid blocks, гільдські summary-картки, per-raid roll-up" width={1280} height={900}>
          <RaidsV2/>
        </DCArtboard>

        <DCArtboard id="r-v3" label="C · Per-raid panels — кожен рейд як окрема секція з власним хедером і прогресом" width={1280} height={900}>
          <RaidsV3/>
        </DCArtboard>

      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
