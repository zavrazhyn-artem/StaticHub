<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>BlastR · Final</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0e10; font-family:'Inter', system-ui, sans-serif; color:#f9f5f8; }
  * { box-sizing: border-box; }
  .ms { font-family:'Material Symbols Rounded'; font-weight:500; line-height:1; vertical-align:middle; -webkit-font-feature-settings:'liga'; font-feature-settings:'liga'; }
  @keyframes pulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.4); opacity:0.55; } }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="dashboard/design-canvas.jsx"></script>
<script type="text/babel" src="dashboard/tokens.jsx"></script>
<script type="text/babel" src="roster/roster-shared.jsx"></script>
<script type="text/babel" src="roster/raids-shared.jsx"></script>
<script type="text/babel" src="roster/roster-v3a.jsx"></script>
<script type="text/babel" src="roster/raids-v1.jsx"></script>
<script type="text/babel" data-presets="react">

function FinalApp() {
  const [tab, setTab] = React.useState('general');
  if (tab === 'raids') return <RaidsV1 onTabChange={setTab}/>;
  return <RosterV3A onTabChange={setTab}/>;
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="final"
        title="BlastR · 2 вкладки"
        subtitle="Робочі таби — клік перемикає між «Загальний» і «Рейди». Однакова перша колонка (220px). Фільтр-пілси під табами. Нові кольори складностей.">

        <DCArtboard id="final-app" label="Фінал — клік на «Рейди» / «Загальний» переключає вкладки" width={1280} height={900}>
          <FinalApp/>
        </DCArtboard>

      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
