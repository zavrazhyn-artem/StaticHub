# =============================================================================
# Production Docker Compose — single droplet.
#
# Services:
#   app          → FrankenPHP web (port 80, HTTP — CF Proxy handles TLS)
#   worker       → supervisord: default + compile + discord queues
#   worker-sync  → supervisord: bnet + rio + wcl queues
#   worker-ai    → supervisord: ai queue
#   scheduler    → php artisan schedule:work
#   redis        → Redis 7 (queues + cache, replaces DO Managed Valkey)
#
# MySQL stays on DO Managed MySQL (VPC private endpoint).
# Droplet must be in VPC default-fra1 (FRA1) for DB access.
# =============================================================================

name: blastr

x-app-defaults: &app-defaults
  image: registry.digitalocean.com/blastr/app:v0.1.12
  restart: unless-stopped
  env_file: /var/www/html/.env
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - app_network

services:

  app:
    <<: *app-defaults
    ports:
      - "80:80"
    volumes:
      - /var/www/html/storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app-defaults
    command: ["worker"]

  worker-sync:
    <<: *app-defaults
    command: ["worker-sync"]

  worker-ai:
    <<: *app-defaults
    command: ["worker-ai"]

  scheduler:
    <<: *app-defaults
    command: ["scheduler"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
