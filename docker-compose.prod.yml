# =============================================================================
# Production Docker Compose — currently runs on the legacy droplet until k8s
# migration. After cutover to DOKS this file is retained only for emergency
# manual deploy / rollback.
#
# Single image, three CMDs:
#   app       → FrankenPHP (replaces nginx + php-fpm). Serves HTTP/HTTPS.
#   worker    → supervisord with per-queue queue:work processes.
#   scheduler → php artisan schedule:work.
#
# No mysql/redis services — both moved to DO Managed (Phase 1 of infra plan).
# =============================================================================

x-app-defaults: &app-defaults
  image: blastr-app:latest
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    target: app
  restart: unless-stopped
  env_file: .env
  networks:
    - app_network

services:

  # ---------------------------------------------------------------------------
  # App — FrankenPHP serving Laravel via Octane workers. Replaces the old
  # nginx + php-fpm pair with a single resident process.
  # ---------------------------------------------------------------------------
  app:
    <<: *app-defaults
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # TLS cert from the existing Cloudflare Origin wildcard. FrankenPHP
      # picks these up via Caddy auto-https for direct HTTPS termination
      # if Cloudflare proxy is bypassed.
      - ./nginx/ssl:/etc/frankenphp/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Worker — supervisord with per-queue queue:work supervised processes.
  # ---------------------------------------------------------------------------
  worker:
    <<: *app-defaults
    command: ["worker"]
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl -c /etc/supervisor/conf.d/worker.conf status | grep -v STOPPED | grep -q RUNNING"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Scheduler — Laravel scheduled tasks tick.
  # ---------------------------------------------------------------------------
  scheduler:
    <<: *app-defaults
    command: ["scheduler"]

networks:
  app_network:
    driver: bridge
