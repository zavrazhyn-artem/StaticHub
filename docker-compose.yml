# =============================================================================
# Local dev — same image as production, FrankenPHP serves everything.
#
# No nginx, no php-fpm, no separate mysql/redis (we use DO Managed via SSH
# tunnel for both). Source code is bind-mounted over the image so edits are
# live; opcache.validate_timestamps is on in dev so PHP picks them up.
#
# Three services, one image:
#   app       → FrankenPHP web server (Octane workers)
#   worker    → supervisord managing per-queue queue:work processes
#   scheduler → php artisan schedule:work
#
# First-time setup:
#   docker compose build
#   docker compose up -d
#   docker compose exec app php artisan migrate --seed
# =============================================================================

x-app-defaults: &app-defaults
  image: blastr-app:dev
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    target: app
  restart: unless-stopped
  env_file: .env
  networks:
    - app_network
  volumes:
    # Live source — edits land instantly inside the container.
    - .:/var/www/html
    # Protect named-volume content from the bind mount above. Docker seeds
    # these from the image on first start, so `composer install` / `npm run
    # build` results survive between container restarts.
    - vendor:/var/www/html/vendor
    - node_build:/var/www/html/public/build
    # Dev PHP overrides: opcache.validate_timestamps=1, display_errors=On.
    - ./docker/app/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro

services:

  # ---------------------------------------------------------------------------
  # App — FrankenPHP HTTP server with Laravel Octane workers.
  # Same image as production; only the volume mounts + dev php.ini differ.
  # ---------------------------------------------------------------------------
  app:
    <<: *app-defaults
    container_name: blastr_app
    ports:
      - "${APP_PORT:-80}:80"
      - "443:443"
      - "5173:5173"   # Vite dev server (npm run dev) when running HMR
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Worker — supervisord managing per-queue queue:work processes.
  # ---------------------------------------------------------------------------
  worker:
    <<: *app-defaults
    container_name: blastr_worker
    command: ["worker"]
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl -c /etc/supervisor/conf.d/worker.conf status | grep -v STOPPED | grep -q RUNNING"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Scheduler — fires Laravel scheduled tasks at the right minute.
  # ---------------------------------------------------------------------------
  scheduler:
    <<: *app-defaults
    container_name: blastr_scheduler
    command: ["scheduler"]

  # ---------------------------------------------------------------------------
  # Cloudflared tunnel — exposes local.blastr.pro through CF to this app.
  # ---------------------------------------------------------------------------
  cloudflared:
    container_name: blastr_cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - app_network
    depends_on:
      - app

networks:
  app_network:
    driver: bridge

volumes:
  vendor:
  node_build:
